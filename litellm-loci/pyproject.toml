[project]
name = "loci-litellm"
version = "0.2.0"
description = "Standalone Loci grounding and memory integration for LiteLLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "litellm>=1.0",
    "pyyaml>=6.0",
]
authors = [
    { name = "rjmendez" },
]

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.9"

[tool.uv.build-backend]
module-root = ""
