# Sanitized reference config for a LiteLLM proxy running the Loci integration.
# Copy, replace the <placeholders>, and validate with:
#     python deploy/check_deployment.py --config config.yaml --env .env
# The same check runs against this file in tests/test_deploy_check.py.
#
# Rules this file demonstrates (see check_deployment.py for the enforced list):
#   * upstreams are DNS names, never IP addresses
#   * every billed deployment carries input/output cost
#   * the embedding group is pinned: no tier, no fallback

model_list:
  # --- tiers: cloud first (order 2-3), local last resort (order 4) ---------------------
  - model_name: simple-tier
    litellm_params:
      model: ollama/resident
      api_base: os.environ/OLLAMA_PROXY_URL      # e.g. https://ollama.<lab-domain>:4443
      order: 4
      timeout: 60
      additional_drop_params: ["think", "reasoning_effort"]
    model_info: {id: local-simple, max_tokens: 8192}
  - model_name: simple-tier
    litellm_params:
      model: openai/<provider>/<small-model>
      api_base: https://gateway.ai.cloudflare.com/v1/<account>/<gateway>/compat
      api_key: os.environ/GATEWAY_API_KEY
      order: 2
    model_info:
      id: cloud-simple
      max_tokens: 8192
      input_cost_per_token: 0.00000006           # list price, dollars per token
      output_cost_per_token: 0.0000004

  - model_name: medium-tier
    litellm_params:
      model: openai/<provider>/<medium-model>
      api_base: https://gateway.ai.cloudflare.com/v1/<account>/<gateway>/compat
      api_key: os.environ/GATEWAY_API_KEY
      order: 3
    model_info:
      id: cloud-medium
      max_tokens: 65536
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005

  # --- explicit-only model: reachable by name, in no tier and no fallback -------------
  - model_name: <provider>/<pinned-model>
    litellm_params:
      model: openai/<provider>/<pinned-model>
      api_base: https://gateway.ai.cloudflare.com/v1/<account>/<gateway>/compat
      api_key: os.environ/GATEWAY_API_KEY
    model_info:
      id: cloud-pinned
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044

  # --- pinned embedder: never a tier, never a fallback --------------------------------
  - model_name: embedding
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_PROXY_URL
    model_info: {id: embed-nomic}

  - model_name: auto-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers: {SIMPLE: simple-tier, MEDIUM: medium-tier, COMPLEX: medium-tier, REASONING: medium-tier}
        classifier_type: heuristic
        complexity_router_default_model: medium-tier

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 0
  cooldown_time: 60
  fallbacks:
    - simple-tier: ["medium-tier"]
  # Clients that name the embedder directly reach the pinned group.
  model_group_alias:
    nomic-embed-text: embedding
    ollama/nomic-embed-text: embedding

litellm_settings:
  drop_params: true
  callbacks:
    - litellm.integrations.loci.grounding_hook.loci_grounding_hook
    - litellm.integrations.loci.memory_writer.loci_memory_writer
    - litellm.integrations.loci.tier_router.loci_tier_router

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_prompts_in_spend_logs: false
  trusted_proxy_ranges: ["127.0.0.1/32", "::1/128"]   # loopback only: no reverse proxy in front
